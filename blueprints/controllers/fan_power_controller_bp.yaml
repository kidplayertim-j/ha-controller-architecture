blueprint:
  name: Fan Power Controller (Target + Override)
  description: >-
    Reconcile virtual fan/heater power from baseline target and orchestration
    override. Blocked prevents all power actions, even override on.
    Power-on applies the selected logical profile via script.fan_profile_apply.
    Does not trigger on actual state or profile changes.
  domain: automation
  author: juan
  input:
    actuator_entity:
      name: Virtual fan actuator
      selector:
        entity:
          domain: fan
    actuator_key:
      name: Profile map device key
      selector:
        text: {}
    power_target:
      name: Power target
      selector:
        entity:
          domain: binary_sensor
    power_override:
      name: Power override
      selector:
        entity:
          domain: [input_select, sensor]
    power_blocked:
      name: Power blocked
      selector:
        entity:
          domain: binary_sensor
    profile_target:
      name: Profile target
      selector:
        entity:
          domain: [sensor, input_select]
    profile_override:
      name: Profile override
      selector:
        entity:
          domain: [sensor, input_select]

mode: restart
max_exceeded: silent
variables:
  actuator: !input actuator_entity
  actuator_key: !input actuator_key
  target_entity: !input power_target
  override_entity: !input power_override
  blocked_entity: !input power_blocked
  profile_target_entity: !input profile_target
  profile_override_entity: !input profile_override
  power_goal: >-
    {% set o = states(override_entity) %}
    {% set t = states(target_entity) %}
    {{ o if o in ['on', 'off'] else (t if t in ['on','off'] else 'invalid') }}
  selected_profile: >-
    {% set valid = {'bath_fan':['lv_1','lv_2','lv_3','lv_4','lv_5'],
                    'aisle_fan':['low','high'], 'kitchen_fan':['low','high'],
                    'bath_heater':['dry_low','dry_high','heat_low','heat_high',
                                   'cool_low','cool_high','vent_low','vent_high']} %}
    {% set o = states(profile_override_entity if profile_override_entity is defined else override_entity) %}
    {% set t = states(profile_target_entity if profile_target_entity is defined else target_entity) %}
    {{ o if o in valid.get(actuator_key, []) else (t if t in valid.get(actuator_key, []) else 'invalid') }}

triggers:
  - trigger: state
    entity_id: !input power_target
  - trigger: state
    entity_id: !input power_override
  - trigger: state
    entity_id: !input power_blocked
    to: 'off'
actions:
  - condition: template
    value_template: "{{ is_state(blocked_entity, 'off') and power_goal in ['on','off'] }}"
  - choose:
      - conditions: "{{ power_goal == 'off' and is_state(actuator, 'on') }}"
        sequence:
          - action: homeassistant.turn_off
            target:
              entity_id: !input actuator_entity
      - conditions: "{{ power_goal == 'on' and is_state(actuator, 'off') }}"
        sequence:
          - condition: template
            value_template: >-
              {% set cfg = {'bath_fan':['lv_1','lv_2','lv_3','lv_4','lv_5'],
                            'aisle_fan':['low','high'],
                            'kitchen_fan':['low','high'],
                            'bath_heater':['dry_low','dry_high','heat_low','heat_high',
                                           'cool_low','cool_high','vent_low','vent_high']} %}
              {{ selected_profile | trim in cfg.get(actuator_key, []) }}
          - action: script.fan_profile_apply
            data:
              actuator: "{{ actuator_key }}"
              target_profile: "{{ selected_profile | trim }}"
